[package]
name = "pkcs12_builder"
version = "0.1.1"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
cms = { version = "0.3.0-pre.2", default-features = false }
const-oid = { version = "0.10.2", default-features = false, features = ["db"] }
der = { version = "0.8.1", default-features = false, features = ["alloc", "derive", "oid", "pem"] }
pkcs5 = { version = "0.8.1", default-features = false, features = ["pbes2"] }
pkcs8 = { version = "0.11.0", default-features = false, features = ["encryption"] }
pkcs12 = { version = "0.2.0-pre.0", default-features = false, features = ["kdf"] }
spki = { version = "0.8.0", default-features = false }
x509-cert = { version = "0.3.0", default-features = false, features = ["hazmat", "builder"] }

crypto-common = { version = "0.2.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
cbc = { version = "0.2.0", default-features = false, optional = true }
des = { version = "0.9.0", default-features = false, optional = true }
rc2 = { version = "0.9.0", default-features = false, optional = true }
sha1 = { version = "0.11.0", default-features = false, optional = true }
sha2 = { version = "0.11.0", default-features = false }

log = "0.4.29"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
rand_core = { version = "0.10.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }

[features]
legacy = ["dep:sha1", "dep:des", "dep:rc2", "dep:cbc", "pkcs5/sha1-insecure", "pkcs5/3des"]

[dev-dependencies]
hex-literal = "1.1.0"
rand = "0.10.0"
openssl = {version = "0.10.75", features = ["vendored"]}
subtle-encoding = "0.5.1"
tempfile = "3.26.0"

# cms and pkcs12 have no published 0.3/0.2 release yet, so pull them from git.
# The block-modes/sponges/hashes/traits primitives now have stable crates.io
# releases the graph resolves onto cleanly, so those patches are no longer needed.
[patch.crates-io]
cms    = { git = "https://github.com/RustCrypto/formats.git" }
pkcs12 = { git = "https://github.com/RustCrypto/formats.git" }
