[package]
name = "pkcs12_builder"
version = "0.1.1"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
cms = { version = "0.3.0-pre.2", features = ["builder"] }
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.0", features = ["alloc", "derive", "oid", "pem"] }
pkcs5 = "0.8.0-rc.13"
pkcs8 = { version = "0.11.0-rc.11", features = ["encryption"] }
pkcs12 = { version = "0.2.0-pre.0", features = ["kdf"] }
spki = "0.8.0-rc.4"
x509-cert = { version = "0.3.0-rc.4", features = ["hazmat", "builder"] }

crypto-common = "0.2.0"
hmac = "0.13.0-rc.5"
cbc = { version = "0.2.0-rc.4", optional = true }
des = { version = "0.9.0-rc.3", optional = true }
rc2 = { version = "0.9.0-rc.1", optional = true }
sha1 = { version = "0.11.0-rc.5", optional = true }
sha2 = "0.11.0-rc.5"

log = "0.4.29"
rand = "0.10.0"
rand_core = { version = "0.10.0" }
subtle = "2.6.1"

[features]
sha1 = ["dep:sha1", "dep:des", "dep:rc2", "dep:cbc", "pkcs5/sha1-insecure", "pkcs5/3des"]

[dev-dependencies]
hex-literal = "1.1.0"
openssl = {version = "0.10.75", features = ["vendored"]}
subtle-encoding = "0.5.1"
tempfile = "3.26.0"

[patch.crates-io]
cms    = { git = "https://github.com/RustCrypto/formats.git" }
pkcs12 = { git = "https://github.com/RustCrypto/formats.git" }

cbc          = { git = "https://github.com/RustCrypto/block-modes.git" }
ctr          = { git = "https://github.com/RustCrypto/block-modes.git" }
keccak       = { git = "https://github.com/RustCrypto/sponges.git" }
sha3         = { git = "https://github.com/RustCrypto/hashes.git" }
universal-hash = { git = "https://github.com/RustCrypto/traits.git" }
